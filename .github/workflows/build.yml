name: build-ipa
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available SDKs (diagnostics)
        run: xcodebuild -showsdks | grep -Ei 'watchos|ios'

      - name: Archive iPhone app (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VitalsWatch.xcodeproj \
            -scheme Vitals \
            -destination 'generic/platform=iOS' \
            -archivePath build/Vitals.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -40

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Vitals.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry VitalsWatch-unsigned.ipa Payload && cd ..
          ls -la build/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitalsWatch-unsigned-ipa
          path: build/VitalsWatch-unsigned.ipa

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VitalsWatch-unsigned.ipa
          generate_release_notes: true
